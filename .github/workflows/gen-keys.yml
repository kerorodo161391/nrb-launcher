name: Generate Tauri Signing Key (one-shot)

# Manual-only: generates a fresh signer keypair, prints PRIVATE + PUBLIC blocks
# so an operator can paste them into GitHub Secrets and tauri.conf.json.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genkey:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --version "^2.0" --locked --quiet

      - name: Generate key
        shell: bash
        env:
          # No password so CI can sign without env-gated secret.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          set -eu
          OUT="$(pwd)/signer"
          mkdir -p "${OUT}"
          cargo tauri signer generate -w "${OUT}/nrb.key"
          # Tauri creates TWO files: <name>.key (private) and <name>.key.pub (public)
          ls -la "${OUT}"
          echo
          echo "=== BEGIN-PRIVATE-KEY-BLOCK ==="
          cat "${OUT}/nrb.key"
          echo
          echo "=== END-PRIVATE-KEY-BLOCK ==="
          echo
          echo "=== BEGIN-PUBLIC-KEY-BLOCK ==="
          cat "${OUT}/nrb.key.pub"
          echo
          echo "=== END-PUBLIC-KEY-BLOCK ==="
          echo
          echo ">>> Copy the two blocks above and update repo secret + tauri.conf.json"
          echo ">>> then re-run the preview workflow."
