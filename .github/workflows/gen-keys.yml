name: Generate Tauri Signing Key (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genkey:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install tauri-cli
        shell: bash
        run: cargo install tauri-cli --version "^2.0" --locked --quiet

      - name: Generate key
        shell: bash
        run: |
          set -eu
          OUT="$(pwd)/signer"
          mkdir -p "${OUT}"
          # password "nutnrb" - encrypted at rest
          cargo tauri signer generate -w "${OUT}/nrb.key" --password "nutnrb"
          ls -la "${OUT}"
          echo
          echo "=== BEGIN-PRIVATE-KEY-BLOCK ==="
          cat "${OUT}/nrb.key"
          echo
          echo "=== END-PRIVATE-KEY-BLOCK ==="
          echo
          echo "=== BEGIN-PUBLIC-KEY-BLOCK ==="
          cat "${OUT}/nrb.key.pub"
          echo
          echo "=== END-PUBLIC-KEY-BLOCK ==="
          echo
          echo ">>> Copy the two blocks above and update repo secret + tauri.conf.json"
