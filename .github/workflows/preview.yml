name: Preview Build (push to main)

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Job 1: Build the Windows installers and publish them to the
  # preview-<semver-tag> release. We disable includeUpdaterJson here
  # because the signing step on a Windows runner is unreliable; the
  # next job handles the manifest instead.
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      semver_tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      short_sha: ${{ steps.tag.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Compute preview tag
        id: tag
        shell: bash
        run: |
          SHORT_SHA="${{ github.sha }}"
          BASE_VERSION=$(grep -m1 "\"version\"" package.json | sed -E "s/.*\"([0-9]+\.[0-9]+\.[0-9]+)\".*/\1/")
          # Match tauri-action default: tag = v<package.json.version>-preview.<short_sha>
          # so the tag we compute here is the SAME one tauri-action will create.
          SEMVER_TAG="v${BASE_VERSION}-preview.${SHORT_SHA:0:7}"
          echo "version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${SEMVER_TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Computed tag: ${SEMVER_TAG}"

      - name: Build Tauri installer (preview pre-release)
        uses: tauri-apps/tauri-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "Preview ${{ steps.tag.outputs.version }}"
          releaseBody: "Auto-generated preview build.\n\nCommit: ${{ github.sha }}\n[See commit](${{ github.event.head_commit.url }})"
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
          args: --target x86_64-pc-windows-msvc

  # Job 2: Sign the installer and emit latest.json on Linux. Linux is
  # reliable for the Tauri signer (no Windows-only crypto deps).
  manifest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tauri config (sparse)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src-tauri/tauri.conf.json
            package.json
            src-tauri/Cargo.lock

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Install tauri-cli (for signer)
        run: cargo install tauri-cli --version "^2.0" --locked --quiet

      - name: Download NSIS installer from preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMVER_TAG: ${{ needs.build.outputs.semver_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -e
          EXE_NAME="NRB.Launcher_${VERSION}_x64-setup.exe"
          gh release download "${SEMVER_TAG}" \
            --repo "${{ github.repository }}" \
            --pattern "${EXE_NAME}" \
            --dir . \
            --clobber
          ls -lh "${EXE_NAME}"
          echo "EXE_NAME=${EXE_NAME}" >> "$GITHUB_ENV"

      - name: Sign installer and emit latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SEMVER_TAG: ${{ needs.build.outputs.semver_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -e
          EXE_PATH="${EXE_NAME}"

          # Fail fast if secrets are unset/empty.
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ] || [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY or TAURI_SIGNING_PRIVATE_KEY_PASSWORD is empty in repo secrets."
            echo "::error::Re-save at https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

          # Stage private key to a temp file (signer reads file path reliably).
          KEY_FILE=$(mktemp)
          printf '%s' "${TAURI_SIGNING_PRIVATE_KEY}" > "${KEY_FILE}"
          chmod 600 "${KEY_FILE}"

          # Print committed pubkey so log shows which key is expected.
          if [ -f "src-tauri/tauri.conf.json" ]; then
            COMMITTED=$(grep -m1 '\"pubkey\"' src-tauri/tauri.conf.json | sed -E 's/.*\"pubkey\":[[:space:]]*\"([^\"]+)\".*/\1/' || true)
            echo "Committed pubkey (b64, first 24 chars): ${COMMITTED:0:24}..."
          else
            echo "::warning::src-tauri/tauri.conf.json not in workspace - cannot pre-verify pubkey match"
          fi

          echo "Signing ${EXE_PATH}..."
          # tauri-cli v2 signer sign does NOT accept --ci. Use -k key-file and -p password.
          cargo tauri signer sign -k "${KEY_FILE}" -p "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" "${EXE_PATH}"
          rm -f "${KEY_FILE}"

          SIG_PATH="${EXE_PATH}.sig"
          if [ ! -f "${SIG_PATH}" ]; then
            echo "::error::Signature file not produced"
            ls -la
            exit 1
          fi
          SIGNATURE=$(cat "${SIG_PATH}")
          echo "Signature acquired (${#SIGNATURE} chars)"

          GH_REPO="${{ github.repository }}"
          EXE_URL="https://github.com/${GH_REPO}/releases/download/${SEMVER_TAG}/${EXE_PATH}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          cat > latest.json <<JSON
          {
            "version": "${VERSION}",
            "notes": "Auto-generated preview build.\n\nCommit: ${{ github.sha }}",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "windows-x86_64": {
                "signature": "${SIGNATURE}",
                "url": "${EXE_URL}"
              }
            }
          }
          JSON
          echo "=== latest.json ==="
          cat latest.json

      - name: Upload latest.json to semver-tagged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMVER_TAG: ${{ needs.build.outputs.semver_tag }}
        run: |
          set -e
          gh release upload "${SEMVER_TAG}" latest.json \
            --repo "${{ github.repository }}" \
            --clobber
          echo "::notice::latest.json uploaded to ${SEMVER_TAG}"

  # Job 3: Keep a stable "preview-latest" alias release so the in-app
  # updater has a fixed URL. Run after manifest job.
  alias:
    needs: [build, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repoint preview-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMVER_TAG: ${{ needs.build.outputs.semver_tag }}
        run: |
          set -e
          if ! gh release view preview-latest >/dev/null 2>&1; then
            gh release create preview-latest \
              --repo "${{ github.repository }}" \
              --target "${SEMVER_TAG}" \
              --prerelease \
              --notes "Rolling pointer to the most recent preview. The in-app updater reads latest.json from this release."
          else
            gh release edit preview-latest \
              --repo "${{ github.repository }}" \
              --target "${SEMVER_TAG}"
          fi

      - name: Propagate latest.json to preview-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMVER_TAG: ${{ needs.build.outputs.semver_tag }}
        run: |
          set -e
          TMP=$(mktemp -d)
          if ! gh release download "${SEMVER_TAG}" \
              --repo "${{ github.repository }}" \
              --pattern "latest.json" \
              --dir "${TMP}"; then
            echo "::error::latest.json missing on ${SEMVER_TAG} - manifest step failed."
            exit 1
          fi
          ls -la "${TMP}"
          for f in "${TMP}"/latest*.json; do
            gh release upload preview-latest "${f}" \
              --repo "${{ github.repository }}" \
              --clobber
          done
          echo "=== preview-latest assets ==="
          gh release view preview-latest \
            --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name'
