name: Preview Build (push to main)

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      # Compute a semver tag for this preview so tauri-action emits latest.json.
      - name: Compute preview tag
        id: tag
        shell: bash
        run: |
          SHORT_SHA="${{ github.sha }}"
          BASE_VERSION=$(grep -m1 "\"version\"" package.json | sed -E "s/.*\"([0-9]+\.[0-9]+\.[0-9]+)\".*/\1/")
          IFS="." read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          SEMVER_TAG="v${NEW_VERSION}-preview.${SHORT_SHA:0:7}"
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${SEMVER_TAG}" >> $GITHUB_OUTPUT
          echo "Computed tag: ${SEMVER_TAG}"

      - name: Build Tauri installer (preview pre-release)
        uses: tauri-apps/tauri-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: "Preview ${{ steps.tag.outputs.version }}"
          releaseBody: "Auto-generated preview build.\n\nCommit: ${{ github.sha }}\n[See commit](${{ github.event.head_commit.url }})"
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true

          args: --target x86_64-pc-windows-msvc

      # Pull the just-generated latest*.json from the new semver release and
      # upload it to a rolling "preview-latest" release so the in-app
      # updater has a stable URL.
      - name: Propagate latest.json to preview-latest release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          SEMVER_TAG="${{ steps.tag.outputs.tag }}"
          if ! gh release view "preview-latest" >/dev/null 2>&1; then
            gh release create preview-latest \
              --repo "${{ github.repository }}" \
              --target "$SEMVER_TAG" \
              --prerelease \
              --notes "Rolling pointer to the most recent preview. The in-app updater reads latest.json from this release."
          else
            gh release edit preview-latest \
              --repo "${{ github.repository }}" \
              --target "$SEMVER_TAG"
          fi
          TMP=$(mktemp -d)
          echo "Downloading latest*.json from $SEMVER_TAG..."
          if ! gh release download "$SEMVER_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "latest*.json" \
              --dir "$TMP"; then
            echo "::warning::No latest*.json found in $SEMVER_TAG - in-app updater won't work this run."
            exit 0
          fi
          echo "Found files:"
          ls -la "$TMP"
          for f in "$TMP"/latest*.json; do
            gh release upload preview-latest "$f" \
              --repo "${{ github.repository }}" \
              --clobber
          done
          echo "=== preview-latest assets now ==="
          gh release view preview-latest --repo "${{ github.repository }}" --json assets --jq ".assets[].name"
